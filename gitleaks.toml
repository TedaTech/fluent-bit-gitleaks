title = "fluent-bit-gitleaks"

[extend]
useDefault = true

[[rules]]
id = "kv-pair-secret"
description = "Secret in a protobuf-text key/value pair, raw or JSON-escaped: key:\"secret-key\" value:\"...\""
regex = '''(?i)key:\\?"[\w.-]*(?:secret|passw(?:or)?d|token|access|credential)[\w.-]*\\?"\s*value:\\?"([^"\\]+)\\?"'''
secretGroup = 1
keywords = ["value:"]

# pii-* rules are personal data, not secrets; the scrubber applies them only to
# tenant-facing tags (kube.*, events.*), never to node or audit logs.
[[rules]]
id = "pii-email"
description = "Personal data: email address"
regex = '''[a-zA-Z0-9][a-zA-Z0-9._%+-]*@[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}'''
keywords = ["@"]

[[rules]]
id = "pii-ipv4"
description = "Personal data: public IPv4 address (four-part version strings match by accepted design)"
regex = '''\b(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}\b'''
[rules.allowlist]
regexes = [
  '''^10\.''',
  '''^127\.''',
  '''^169\.254\.''',
  '''^192\.168\.''',
  '''^172\.(1[6-9]|2[0-9]|3[01])\.''',
  '''^0\.0\.0\.0$''',
]
