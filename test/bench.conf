[SERVICE]
    Flush     1
    Log_Level warn
    HTTP_Server On
    HTTP_Port   2020
    Parsers_File /fluent-bit/etc/parsers.conf
[INPUT]
    Name           tail
    Path           /data/in.jsonl
    Parser         json
    Read_from_Head On
    Buffer_Max_Size 256k
@INCLUDE /bench/filter.conf
[OUTPUT]
    Name   file
    Match  *
    Path   /out
    File   out.jsonl
    Format plain
